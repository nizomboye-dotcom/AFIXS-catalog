<!doctype html>
<html lang="ru">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFIXS Catalog Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif;color:#222}
.toolbar{padding:12px;background:#fff;display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}
button{border:0;border-radius:8px;padding:10px 14px;background:#ff8c00;color:#fff;font-weight:bold;cursor:pointer}.dark{background:#222!important}.red{background:#c62828!important}
.wrap{max-width:1100px;margin:16px auto;padding:0 10px}.catalog{background:#fff;padding:0 8px 18px}
.header{height:160px;background:#ff8c00;position:relative;padding:22px;color:#fff;overflow:hidden}
.logo{position:absolute;left:18px;top:10px;width:235px;height:120px;object-fit:contain;z-index:2}

.marks{position:absolute;right:22px;top:35px;color:#222;font-size:48px;line-height:.45;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.card{border:2px solid #ff8c00;cursor:pointer}
.cardhead{height:45px;background:#ff8c00;color:#fff;font-weight:900;padding:12px;font-size:12px}.photo{height:190px;display:flex;align-items:center;justify-content:center}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{color:#aaa;text-align:center}
.desc{padding:6px 8px;font-size:9px;min-height:30px;max-height:42px;overflow:hidden;border-top:1px solid #eee;color:#555;line-height:1.15}.spec{display:grid;grid-template-columns:1fr 1fr;font-size:9px;padding:5px 7px;background:#e6e6e6}.spec:nth-child(even){background:#fff}
.editor{position:fixed;right:0;top:0;width:min(400px,100%);height:100%;background:#fff;z-index:20;padding:18px;overflow:auto;box-shadow:-4px 0 20px #0003;transform:translateX(100%);transition:.2s}.editor.open{transform:none}
input,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:7px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:4px}.row{display:grid;grid-template-columns:1fr 1fr 35px;gap:5px;margin:6px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.photo{height:150px}}@media(max-width:480px){.grid{grid-template-columns:1fr}.header{height:125px}.logo{font-size:40px}}
@page{size:A4 portrait;margin:0}
@media print{.toolbar,.editor{display:none!important}body{background:white}.wrap{margin:0;max-width:none}.catalog{box-shadow:none}}
</style>
</head>
<body>
<div class="toolbar">
<button onclick="createCatalog()">＋ Создать новый каталог</button>
<button onclick="addCard()">＋ Добавить карточку</button>
<button onclick="document.getElementById('photos').click()">📷 Добавить фотографии</button>
<input id="photos" type="file" accept="image/*" multiple hidden onchange="importPhotos(event)">
<button onclick="saveCatalog()">💾 Сохранить</button>
<button class="dark" onclick="setTimeout(()=>window.print(),100)">🖨 Сохранить как PDF</button>
</div>

<div id="grid" class="grid"></div></div></div>
<div id="editor" class="editor">
<button class="dark" onclick="closeEditor()">✕ Закрыть</button>
<h2>Редактирование</h2>
<div class="field"><label>Название</label><input id="name" oninput="saveEdit()"></div>
<div class="field"><label>Фото</label><input type="file" accept="image/*" onchange="setPhoto(event)"></div>
<div class="field"><label>Описание</label><textarea id="desc" oninput="saveEdit()"></textarea></div>
<h3>Характеристики</h3><div id="rows"></div>
<button onclick="addRow()">＋ Добавить строку</button>
<br><br><button class="red" onclick="removeCard()">Удалить карточку</button>
</div>
<script>
let catalogs=[],catalogCurrent=0,current=-1;
const STORAGE_KEY="AFIXS_CATALOG_EDITOR_DATA";
function saveCatalog(){localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs));alert("Каталог сохранён");}
function loadCatalog(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){const data=JSON.parse(saved);if(Array.isArray(data)&&data.length){if(data[0]&&Array.isArray(data[0].cards))catalogs=data;else catalogs=[{cards:data}];return true}}}catch(e){}return false}
function blank(){return{name:"НАЗВАНИЕ ТОВАРА",photo:"",desc:"",rows:[["Motor turi",""],["Kuchlanish (V)",""],["Tok kuchi (A)",""],["Moment (N·m)",""],["Aylanish (RPM)",""],["Vazni (kg)",""]]}};
if(!loadCatalog()){const initial=[];for(let i=0;i<12;i++)initial.push(blank());catalogs=[{cards:initial}]}
let cards=[];
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function render(){
  const container=document.querySelector('.wrap').parentElement;
  const template=document.querySelector('.wrap');
  container.querySelectorAll('.wrap').forEach((el,i)=>{if(i>0)el.remove()});
  catalogs.forEach((cat,ci)=>{
    const wrap=ci===0?template:template.cloneNode(true);
    wrap.querySelector('.grid').innerHTML=cat.cards.map((c,i)=>`<div class="card" onclick="openEditor(${ci},${i})"><div class="cardhead">${esc(c.name)}</div><div class="photo">${c.photo?`<img src="${c.photo}">`:`<div class="placeholder">НАЖМИТЕ ДЛЯ ДОБАВЛЕНИЯ ФОТО</div>`}</div><div class="desc">${esc(c.desc||"Описание товара")}</div>${c.rows.map(r=>`<div class="spec"><span>${esc(r[0])}</span><span>${esc(r[1]||"—")}</span></div>`).join("")}</div>`).join("");
    if(ci>0)container.appendChild(wrap);
  });
}
function openEditor(ci,i){catalogCurrent=ci;current=i;cards=catalogs[ci].cards;document.getElementById("name").value=cards[i].name;document.getElementById("desc").value=cards[i].desc;renderRows();document.getElementById("editor").classList.add("open")}
function closeEditor(){document.getElementById("editor").classList.remove("open");current=-1}
function saveEdit(){if(current<0)return;cards[current].name=document.getElementById("name").value;cards[current].desc=document.getElementById("desc").value;render();localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs))}
function renderRows(){document.getElementById("rows").innerHTML=cards[current].rows.map((r,i)=>`<div class="row"><input value="${esc(r[0])}" oninput="cards[current].rows[${i}][0]=this.value;render()"><input value="${esc(r[1])}" oninput="cards[current].rows[${i}][1]=this.value;render()"><button class="red" onclick="cards[current].rows.splice(${i},1);renderRows();render()">×</button></div>`).join("")}
function addRow(){cards[current].rows.push(["Новая характеристика",""]);renderRows();render()}
function addCard(){const source=current>=0?cards[current]:(cards[0]||blank());const copy=JSON.parse(JSON.stringify(source));cards.push(copy);localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs));render();openEditor(catalogCurrent,cards.length-1)}
function createCatalog(){const source=catalogs[catalogCurrent]||catalogs[0];const copy=JSON.parse(JSON.stringify(source));catalogs.push(copy);catalogCurrent=catalogs.length-1;current=-1;localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs));render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function removeCard(){cards.splice(current,1);closeEditor();render();localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs))}
function setPhoto(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{cards[current].photo=r.result;render();localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs))};r.readAsDataURL(f)}
function importPhotos(e){[...e.target.files].forEach(f=>{let r=new FileReader();r.onload=()=>{let i=cards.findIndex(c=>!c.photo);if(i<0){cards.push(blank());i=cards.length-1}cards[i].photo=r.result;cards[i].name=f.name.replace(/\.[^.]+$/," ").toUpperCase();render();localStorage.setItem(STORAGE_KEY,JSON.stringify(catalogs))};r.readAsDataURL(f)});e.target.value=""}
render();
</script>
</body>
</html>
