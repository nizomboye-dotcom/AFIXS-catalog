<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFIXS — Вход</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eee;font-family:Arial,sans-serif;color:#222}
.login{width:min(380px,92%);background:#fff;padding:30px;border-radius:14px;box-shadow:0 4px 20px #0002}
h1{margin:0 0 22px;text-align:center;color:#ff8c00}
label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px}
button{width:100%;margin-top:18px;border:0;border-radius:8px;padding:11px;background:#ff8c00;color:#fff;font-weight:bold;font-size:15px;cursor:pointer}
.error{color:#c62828;text-align:center;margin-top:12px;min-height:18px;font-size:13px}
</style>
</head>
<body>
<div class="login">
<h1>AFIXS</h1>
<label>Логин</label>
<input id="login" autocomplete="username">
<label>Пароль</label>
<input id="password" type="password" autocomplete="current-password">
<button onclick="enter()">Войти</button>
<div id="error" class="error"></div>
</div>

<script>
/*
  ==============================
  ЗДЕСЬ МЕНЯЮТСЯ ЛОГИНЫ И ПАРОЛИ
  ==============================
  username: логин
  password: пароль
  catalog: какой файл каталога открыть
*/
const USERS = {
  "admin":   { password: "1234", catalog: "catalog.html" },
  "manager": { password: "5678", catalog: "catalog.html" }
  "ISMOIL": { password: "+998998480660", catalog: "catalog.html" }
};

function enter(){
  const login=document.getElementById("login").value.trim();
  const password=document.getElementById("password").value;

  if(USERS[login] && USERS[login].password === password){
    sessionStorage.setItem("afixs_login","1");
    sessionStorage.setItem("afixs_user",login);
    location.href=USERS[login].catalog;
  }else{
    document.getElementById("error").textContent="Неверный логин или пароль";
  }
}

document.getElementById("password").addEventListener("keydown",e=>{
  if(e.key==="Enter") enter();
});
</script>
</body>
</html>
