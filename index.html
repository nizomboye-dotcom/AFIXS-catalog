<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AFIXS — Вход</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eee;font-family:Arial,sans-serif;color:#222}
.box{width:360px;max-width:92%;background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px #0002}
h1{text-align:center;margin:0 0 24px}input{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}button{width:100%;padding:12px;margin-top:10px;border:0;border-radius:8px;background:#ff8c00;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}#error{color:#c62828;text-align:center;min-height:22px;margin-top:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="box">
<h1>AFIXS Catalog</h1>
<input id="login" placeholder="Логин" autocomplete="username">
<input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
<button type="button" id="loginBtn">Войти</button>
<div id="error"></div>
</div>
<script>
const SUPABASE_URL='https://pbjwremrjgbqvvwjfqo.supabase.co';
const SUPABASE_KEY='sb_publishable_ybnz42II6K-3xgb9GTdx2A_AA-N7_n_';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function emailFromLogin(login){return login.includes('@')?login.trim():login.trim()+'@afixs.uz';}
async function enter(){
 const login=document.getElementById('login').value.trim();
 const password=document.getElementById('password').value;
 const error=document.getElementById('error');
 error.textContent='';
 if(!login||!password){error.textContent='Введите логин и пароль';return;}
 const {error:authError}=await supabase.auth.signInWithPassword({email:emailFromLogin(login),password});
 if(authError){error.textContent='Неверный логин или пароль';console.error(authError);return;}
 location.replace('catalog.html');
}
document.getElementById('loginBtn').addEventListener('click',enter);
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
(async()=>{const {data}=await supabase.auth.getSession();if(data.session)location.replace('catalog.html')})();
</script>
</body>
</html>
